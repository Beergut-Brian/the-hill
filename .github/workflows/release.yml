name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [dev, main]

env:
  GODOT_VERSION: "4.7.2"   # keep in sync with .godot-version

permissions:
  contents: write   # the Release step creates releases and uploads the zip

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2   # verify this tag exists on Docker Hub; else pin the nearest 4.7.x
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - name: Install gdUnit4
        run: |
          git clone --depth 1 https://github.com/MikeSchulze/gdUnit4 /tmp/gdunit
          mkdir -p addons && cp -r /tmp/gdunit/addons/gdUnit4 addons/
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Run tests
        run: godot --headless --path . -s addons/gdUnit4/bin/GdUnitCmdTool.gd -a tests --ignoreHeadlessMode --continue
      - name: Headless boot screenshot
        run: |
          godot --headless --path . -- --screenshot-after=3 || true
          ls -la ~/.local/share/godot/app_userdata/*/screenshots/ 2>/dev/null || echo "no screenshot (headless renderer)"

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2   # verify this tag exists on Docker Hub; else pin the nearest 4.7.x
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
      - name: Stamp the version
        shell: bash   # the lobby's version label reads data/build.json (BuildInfo); no file = "dev"
        run: |
          printf '{ "version": "%s", "commit": "%s" }\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > data/build.json
          cat data/build.json
      - name: Export Linux
        run: |
          mkdir -p build
          godot --headless --path . --import || true
          godot --headless --path . --export-release "Linux" build/game.x86_64
      - name: Smoke-test the exported build
        shell: bash   # the export must boot without script errors (Spaceballs once shipped two builds that quit on launch)
        run: |
          timeout 60 build/game.x86_64 --headless --audio-driver Dummy --quit-after 600 > smoke.log 2>&1 || true
          cat smoke.log
          if grep -E "SCRIPT ERROR|Failed to load script|Can't load dependency|File not found" smoke.log; then echo "export is broken"; exit 1; fi
      - name: Write launcher manifest
        shell: bash   # [[ ]] below is bash; the container default sh made every build dev=false
        run: |
          NAME=$(grep -m1 'config/name=' project.godot | sed 's/.*="\(.*\)"/\1/')
          SLUG=${GITHUB_REPOSITORY#*/}
          cat > build/openjar.json <<JSON
          { "slug": "$SLUG", "name": "$NAME", "version": "${GITHUB_REF_NAME}",
            "binary": "game.x86_64", "grid": "store/grid.png", "hero": "store/hero.png",
            "clip": "store/clip.mp4", "jar": "store/jar.glb", "dev": $( [[ "$GITHUB_REF_NAME" == *-dev* ]] && echo true || echo false ) }
          JSON
          # grid, hero and jar.glb (the launcher's jar world, art/tools/make_jar.sh) ship next to the
          # binary; a release without them fails here instead of quietly showing the fallback jar.
          mkdir -p build/store
          cp store/jar.glb store/grid.png store/hero.png build/store/
          test -s build/store/jar.glb && test -s build/store/grid.png && test -s build/store/hero.png
          cat build/openjar.json
      - name: Zip
        run: cd build && zip -r "../${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}-linux.zip" .
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*-linux.zip"
          prerelease: ${{ contains(github.ref_name, '-dev') }}
          generate_release_notes: true
